name: Update videos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 update_videos.py
      - name: Commit changes
        run: bash .github/scripts/commit-push.sh "Update videos" videos.json shorts.json international.json
