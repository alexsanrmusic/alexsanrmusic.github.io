name: Update videos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 update_videos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add videos.json shorts.json international.json
          git diff --cached --quiet || (git commit -m "Update videos" && git push)
