name: Cancel stuck Pages deployment

# Разовый запуск вручную: Actions -> Cancel stuck Pages deployment -> Run workflow.
# Снимает «зависшую» публикацию GitHub Pages, из-за которой новые публикации падают
# с ошибкой «due to in progress deployment. Please cancel <SHA> first».
# После успешного запуска файл можно удалить.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA зависшей публикации (из ошибки после слов 'Please cancel')"
        default: "65279b06169a7c94e80afae6d17c13fc306c5b88"
      force_delete:
        description: "Если отмена не помогла: удалить эту публикацию (true/false)"
        default: "false"

permissions:
  contents: read
  pages: write
  deployments: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          FORCE: ${{ inputs.force_delete }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::SHA должен состоять из 7-40 символов 0-9a-f"
            exit 1
          fi
          echo "== Последние публикации github-pages (id, коммит, дата) =="
          gh api "repos/$REPO/deployments?environment=github-pages&per_page=10" \
            --jq '.[] | "\(.id)  \(.sha[0:8])  \(.created_at)"' || true
          echo "== Отмена $SHA =="
          if gh api -X POST "repos/$REPO/pages/deployments/$SHA/cancel"; then
            echo "Отменено. Теперь перезапустите упавший 'pages build and deployment'."
            exit 0
          fi
          echo "Отменить не удалось."
          if [ "$FORCE" != "true" ]; then
            echo "Если ошибка осталась, запустите ещё раз с force_delete = true."
            exit 1
          fi
          ID=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" \
                 --jq ".[] | select(.sha==\"$SHA\") | .id" | head -1)
          if [ -z "$ID" ]; then
            echo "::error::Публикация с таким SHA не найдена"
            exit 1
          fi
          STATE=$(gh api "repos/$REPO/deployments/$ID/statuses" --jq '.[0].state // "none"')
          echo "Публикация $ID, последний статус: $STATE"
          if [ "$STATE" = "success" ]; then
            echo "::error::Это рабочая (живая) публикация сайта, удалять её нельзя"
            exit 1
          fi
          gh api -X POST "repos/$REPO/deployments/$ID/statuses" -f state=inactive
          gh api -X DELETE "repos/$REPO/deployments/$ID"
          echo "Удалена зависшая публикация $ID. Перезапустите 'pages build and deployment'."
