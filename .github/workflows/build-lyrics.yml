name: Build lyrics pages

on:
  push:
    paths:
      - "lyrics/**"
      - "albums.json"
      - "albums.html"
      - "build_lyrics.py"
  workflow_dispatch:

permissions:
  contents: write

# Одна общая очередь для всех workflow, которые пишут в репозиторий
# (build-lyrics, update-videos, telegram, fetch-fonts): они идут по очереди, а не одновременно.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pages
        run: python3 build_lyrics.py
      - name: Commit changes
        run: bash .github/scripts/commit-push.sh "Build lyrics pages" songs albums lyrics.html lyrics.json site.css favicon.png sitemap.xml
