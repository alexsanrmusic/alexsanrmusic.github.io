name: Build lyrics pages

on:
  push:
    paths:
      - "lyrics/**"
      - "albums.json"
      - "albums.html"
      - "build_lyrics.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lyrics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pages
        run: python3 build_lyrics.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A songs lyrics.html lyrics.json site.css favicon.png sitemap.xml
          git diff --cached --quiet || (git commit -m "Build lyrics pages" && git pull --rebase && git push)
