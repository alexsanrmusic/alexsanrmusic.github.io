name: Fetch fonts

# Запускается вручную: Actions -> Fetch fonts -> Run workflow.
# Скачивает шрифты Onest и Unbounded в папку fonts/ и делает коммит.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download fonts
        run: python3 tools/fetch_fonts.py
      - name: Commit changes
        run: bash .github/scripts/commit-push.sh "Add self-hosted fonts" fonts
