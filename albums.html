<style>
:root {
  --bg: #0b0f1f;
  --surface: #151b32;
  --fg: #edf0f9;
  --muted: #9aa4c4;
  --line: #272f4f;
  --accent: #ffc83d;
  --accent-ink: #0b0f1f;
  --blue: #8ba4ff;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; }
html { overflow-x: clip; }
body {
  background:
    radial-gradient(900px 480px at 85% -120px, rgba(139,164,255,.16), transparent 70%),
    radial-gradient(700px 420px at -10% 8%, rgba(255,200,61,.10), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-inline: 20px;
}
.wrap { max-width: 1200px; margin-inline: auto; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

header { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; padding-block: 16px; }
header::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: calc(50% - 50vw); right: calc(50% - 50vw); border-bottom: 1px solid var(--line); background: rgba(11, 15, 31, 0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 16px; text-decoration: none; letter-spacing: 0.02em; }
nav { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; }
nav a { text-decoration: none; color: var(--muted); }
nav a:hover, nav a[aria-current="page"] { color: var(--fg); }

main { padding-block: 48px 64px; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.8rem, 6vw, 3rem); letter-spacing: -0.02em; margin: 0 0 12px; background: linear-gradient(90deg, var(--fg) 40%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.lead { margin: 0 0 8px; color: var(--muted); max-width: 52ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; min-height: 30px; }
.stat { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--muted); }
.stat b { color: var(--fg); font-weight: 600; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 28px; }
.filters-label { color: var(--muted); font-size: 15px; margin-right: 4px; }
.chip { border: 1.5px solid var(--line); background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.album { --c1: var(--accent); --c2: #ff8a5c; position: relative; background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 9%, var(--surface)), var(--surface) 55%); border: 1px solid var(--line); border-radius: 22px; margin-bottom: 16px; overflow: hidden; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; animation: rise .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 80ms); }
.album[data-lang="uk"] { --c1: #ffc83d; --c2: #5b8cff; }
.album[data-lang="en"] { --c1: #7fb2ff; --c2: #8a6bff; }
.album[data-lang="ru"] { --c1: #ff8a5c; --c2: #e8477a; }
.album:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c1) 55%, var(--line)); box-shadow: 0 14px 40px -18px var(--c1); }
.album.open { border-color: color-mix(in srgb, var(--c1) 60%, var(--line)); box-shadow: 0 18px 50px -22px var(--c1); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.album-head { display: flex; align-items: center; gap: 18px; width: 100%; padding: 16px 20px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.cover { flex: none; position: relative; width: 88px; height: 88px; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--accent-ink); background: linear-gradient(135deg, var(--c1), var(--c2)); overflow: hidden; box-shadow: 0 10px 26px -10px var(--c1); transition: transform .3s ease; }
.cover img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
.album:hover .cover { transform: scale(1.04) rotate(-1.5deg); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { font-size: 12.5px; line-height: 1; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); border: 1px solid transparent; }
.badge-lang { color: var(--accent-ink); background: var(--c1); font-weight: 600; }
.badge-inst { color: var(--c1); border-color: var(--c1); font-weight: 600; }
.album-info { flex: 1; min-width: 0; }
.album-title { display: block; font-family: var(--font-display); font-weight: 500; font-size: clamp(1.05rem, 3.4vw, 1.35rem); line-height: 1.25; }
.album-meta { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
.chev { flex: none; width: 12px; height: 12px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; margin-right: 6px; }
.album.open .chev { transform: rotate(-135deg); }
.album-body { padding: 4px 20px 22px; }
.album-body[hidden] { display: none; }
.album.open .album-body { animation: unfold .35s ease both; }
@keyframes unfold { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.track { transition: background .2s ease; border-radius: 10px; }
.track:hover { background: rgba(255,255,255,.035); }
.track.playing .track-name { color: var(--c1); font-weight: 500; }
.eq { display: none; align-items: flex-end; gap: 2px; height: 14px; margin-left: 8px; vertical-align: middle; }
.track.playing .eq { display: inline-flex; }
.eq i { display: block; width: 3px; height: 100%; background: var(--c1); border-radius: 2px; transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; }
.eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) {
  .album, .album.open .album-body, .eq i { animation: none; }
  .album, .cover { transition: none; }
  .album:hover, .album:hover .cover { transform: none; }
}


.tracks { list-style: none; margin: 0; padding: 0; counter-reset: t; border-top: 1px solid var(--line); }
.track { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 10px; border-bottom: 1px solid var(--line); counter-increment: t; }
.track-name { flex: 1 1 200px; min-width: 0; }
.pill-play { background: transparent; color: var(--fg); border: 1.5px solid var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.pill-play:hover { background: var(--bg); border-color: var(--fg); }
.pill-share { background: transparent; color: var(--fg); border: 1.5px solid var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.pill-share:hover { border-color: var(--fg); }
.drive-player { flex: 1 1 100%; }
.drive-player[hidden] { display: none; }
.lyrics { margin-top: 12px; padding: 16px 20px 18px; border-left: 3px solid var(--c1); border-radius: 0 14px 14px 0; background: rgba(255,255,255,.04); animation: unfold .35s ease both; }
.lyrics[hidden] { display: none; }
.lyrics-label { display: block; margin-bottom: 8px; color: var(--c1); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.lyrics-text { margin: 0; font-size: 16px; line-height: 1.75; white-space: pre-line; overflow-wrap: anywhere; }
.drive-player audio { display: block; width: 100%; height: 44px; color-scheme: dark; }
.subs { position: relative; max-height: 240px; overflow-y: auto; padding-block: 8px; }
.subs p { margin: 0; padding: 3px 0; color: var(--muted); font-size: 16px; line-height: 1.45; cursor: pointer; transform-origin: left; transition: color .2s, transform .2s; }
.subs p:hover { color: var(--fg); }
.subs p.on { color: var(--c1); font-weight: 600; transform: scale(1.1); }
.drive-player iframe { display: block; width: 100%; height: 260px; border: 0; border-radius: 10px; background: #0000; }
.track-name::before { content: counter(t) ". "; color: var(--muted); }
.track-links { display: flex; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; }
.pill-dl { background: var(--accent); color: var(--accent-ink); }
.pill-dl:hover { filter: brightness(1.06); }
.pill-clip { border: 1.5px solid var(--fg); }
.pill-clip:hover { background: var(--bg); }
.pill-ghost { visibility: hidden; border: 1.5px solid transparent; }

.note { color: var(--muted); }
footer { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; padding-block: 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }

@media (max-width: 600px) {
  body { font-size: 16px; padding-inline: 16px; }
  .album-head { padding: 14px; gap: 14px; }
  .album-body { padding: 4px 14px 18px; }
  .cover { width: 64px; height: 64px; font-size: 19px; border-radius: 14px; }
  .track { padding-inline: 4px; }
  .pill-ghost { display: none; }
  .track-links { order: 3; }
}

<script src="miniplayer.js"></script>
<script>
(function () {
  var LANG_CODES = { uk: 'UA', en: 'EN', ru: 'RU' };
  var FLAGS = { uk: '🇺🇦', en: '🇬🇧', ru: '🇷🇺' };
  var T = I18N.t;
  var LANGS = { uk: T('lang.uk'), ru: T('lang.ru'), en: T('lang.en') };
  var albumsEl = document.getElementById('albums');
  var filtersEl = document.getElementById('filters');
  var albums = [];
  var currentLang = 'all';

  document.getElementById('year').textContent = new Date().getFullYear();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // Ключ Google Drive API (см. инструкцию). Пока пусто — используется обычная ссылка Drive.
  var DRIVE_KEY = 'AIzaSyBitkFL-uqp7Hq7MM5WqLrd5PN0ptuTyJ0';

  function driveLink(id) {
    return 'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(id) + '&export=download&confirm=t';
  }

  function closeDrivePlayer(h) {
    if (h._off) { h._off(); h._off = null; }
    h.hidden = true;
    h.textContent = '';
    if (h.parentNode) h.parentNode.classList.remove('playing');
    if (h.btn) h.btn.textContent = T('track.play');
  }

  var lyricsPromise = null;
  function getLyrics() {
    if (!lyricsPromise) {
      lyricsPromise = fetch('lyrics.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .catch(function () { return {}; });
    }
    return lyricsPromise;
  }

  // Ссылки на страницы песен берём из lyrics.json (ключ _slugs); пока не загрузились — ссылка на плеер альбома.
  var slugs = {};
  getLyrics().then(function (all) { slugs = (all && all._slugs) || {}; });

  function shareTrack(btn, t, album, n) {
    var slug = slugs[album.id] && slugs[album.id][t.title];
    var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
    var url = slug ? base + 'songs/' + album.id + '/' + slug + '.html'
                   : base + 'albums.html?album=' + encodeURIComponent(album.id) + '&track=' + n;
    var data = { title: t.title + ' — Alex Sanr', url: url };
    function done() {
      var label = btn.textContent;
      btn.textContent = T('song.copied');
      setTimeout(function () { btn.textContent = label; }, 2000);
    }
    if (navigator.share) { navigator.share(data).catch(function () {}); return; }
    try { navigator.clipboard.writeText(url).then(done, function () { window.prompt('', url); }); }
    catch (e) { window.prompt('', url); }
  }

  // Звук і субтитри ведуть міні-плеєр (miniplayer.js) — тому музика не зупиняється ні при згортанні
  // альбому, ні при переході на іншу сторінку. Тут лише панель субтитрів під треком.
  // Якщо miniplayer.js не завантажився — сторінка все одно працює (як раніше, через вбудований програвач Drive).
  var MP = window.MP || (function () {
    var fns = [], m = {
      cur: null, cues: null, active: -1,
      audio: { paused: true, play: function () { return Promise.resolve(); } },
      page: function (f) { fns.push(f); return function () {}; },
      close: function () { m.cur = null; },
      play: function (q, i) { m.cur = q[i]; setTimeout(function () { fns.forEach(function (f) { f('error'); }); }, 0); }
    };
    return m;
  })();
  var trackRows = {};
  function trackKey(albumId, title) { return albumId + '|' + title; }
  function queueOf(album) {
    return album.tracks.filter(function (x) { return x.drive || x.audio; }).map(function (x) {
      return {
        title: x.title, album: album.title, albumId: album.id, drive: x.drive || '',
        cover: album.cover ? new URL(album.cover, location.href).href : '',
        src: x.audio || (DRIVE_KEY && x.drive
          ? 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(x.drive) + '?alt=media&key=' + DRIVE_KEY
          : driveLink(x.drive))
      };
    });
  }

  function openView(holder, t, album) {
    Array.prototype.forEach.call(document.querySelectorAll('.drive-player'), closeDrivePlayer);
    var ly = el('div', 'lyrics');
    holder.appendChild(ly);
    var box = null, nodes = [], act = -1, userScroll = 0, tok = 0;
    function mark() {
      if (!box || MP.active === act) return;
      if (nodes[act]) nodes[act].classList.remove('on');
      act = MP.active;
      var n = nodes[act];
      if (!n) return;
      n.classList.add('on');
      if (Date.now() - userScroll > 3000) box.scrollTo({ top: n.offsetTop - box.clientHeight / 2 + n.offsetHeight / 2, behavior: 'smooth' });
    }
    function build() {
      var my = ++tok, c = MP.cues;
      ly.textContent = '';
      box = null; nodes = []; act = -1;
      ly.appendChild(el('span', 'lyrics-label', T('lyrics.label')));
      if (c) {
        box = el('div', 'subs');
        box.addEventListener('wheel', function () { userScroll = Date.now(); }, { passive: true });
        box.addEventListener('touchmove', function () { userScroll = Date.now(); }, { passive: true });
        c.forEach(function (cue) {
          var p = el('p', null, cue.t);
          p.addEventListener('click', function () { MP.audio.currentTime = cue.s; MP.audio.play().catch(function () {}); });
          nodes.push(p); box.appendChild(p);
        });
        ly.appendChild(box);
        mark();
      } else {
        getLyrics().then(function (all) {
          var txt = all[album.id] && all[album.id][t.title];
          if (my !== tok || !txt) return;
          ly.appendChild(el('p', 'lyrics-text', txt));
        });
      }
    }
    holder._off = MP.page(function (ev) {
      if (ev === 'cues') build(); else if (ev === 'line') mark();
    });
    holder.hidden = false;
    if (holder.parentNode) holder.parentNode.classList.add('playing');
    holder.btn.textContent = T('track.close');
    build();
  }

  function toggleDrivePlayer(holder, t, album) {
    if (!holder.hidden) { closeDrivePlayer(holder); return; }
    var q = queueOf(album), c = MP.cur;
    if (c && c.albumId === album.id && c.title === t.title) {
      if (MP.audio.paused) MP.audio.play().catch(function () {});
    } else {
      MP.play(q, q.map(function (x) { return x.title; }).indexOf(t.title));
    }
    openView(holder, t, album);
  }

  MP.page(function (ev) {
    if (ev === 'track') {
      var c = MP.cur, r = c && trackRows[trackKey(c.albumId, c.title)];
      if (r && r.li.offsetParent !== null) openView(r.holder, r.t, r.album);
      else Array.prototype.forEach.call(document.querySelectorAll('.drive-player'), closeDrivePlayer);
    } else if (ev === 'error' && MP.cur && MP.cur.drive) {
      // Google Drive не віддав аудіо напряму — запасний варіант: вбудований програвач Drive (без субтитрів)
      var cur = MP.cur, row = trackRows[trackKey(cur.albumId, cur.title)];
      MP.close();
      if (!row) return;
      var f = document.createElement('iframe');
      f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(cur.drive) + '/preview';
      f.title = T('track.player', { t: cur.title });
      f.setAttribute('allow', 'autoplay');
      f.setAttribute('frameborder', '0');
      row.holder.appendChild(f);
      row.holder.hidden = false;
      row.li.classList.add('playing');
      row.holder.btn.textContent = T('track.close');
    }
  });

  function closeAlbum(card) {
    card.classList.remove('open');
    card.querySelector('.album-head').setAttribute('aria-expanded', 'false');
    var body = card.querySelector('.album-body');
    body.hidden = true;
    Array.prototype.forEach.call(body.querySelectorAll('.drive-player'), closeDrivePlayer);
  }

  function openAlbum(card, album) {
    Array.prototype.forEach.call(albumsEl.querySelectorAll('.album.open'), function (c) {
      if (c !== card) closeAlbum(c);
    });
    card.classList.add('open');
    card.querySelector('.album-head').setAttribute('aria-expanded', 'true');
    var body = card.querySelector('.album-body');
    body.hidden = false;
  }

  function buildCard(album) {
    var card = el('article', 'album');
    card.dataset.lang = album.lang;
    card.dataset.id = album.id;

    var head = el('button', 'album-head');
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    var cover = el('span', 'cover', LANG_CODES[album.lang] || (album.lang || '').toUpperCase());
    if (album.cover) {
      // Картинка сразу в DOM (иначе lazy не работает): подпись-заглушка (UK/RU/EN) лежит под ней
      // и убирается после загрузки; при ошибке остаётся заглушка.
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = '';
      img.width = 128; img.height = 128;
      img.addEventListener('load', function () {
        if (cover.firstChild && cover.firstChild.nodeType === 3) cover.removeChild(cover.firstChild);
      });
      // В списке берём маленькую копию (images/thumbs/*.jpg, 176 px); нет её - полная обложка; нет и её - заглушка
      var thumb = album.cover.replace(/^images\//, 'images/thumbs/').replace(/\.[a-z0-9]+$/i, '.jpg');
      img.addEventListener('error', function () {
        if (img.getAttribute('src') !== album.cover) img.src = album.cover; else img.remove();
      });
      img.src = thumb;
      cover.appendChild(img);
    }
    head.appendChild(cover);
    var info = el('span', 'album-info');
    info.appendChild(el('span', 'album-title', album.title));
    var badges = el('span', 'badges');
    badges.appendChild(el('span', 'badge badge-lang', (FLAGS[album.lang] ? FLAGS[album.lang] + ' ' : '') + (LANGS[album.lang] || album.lang)));
    badges.appendChild(el('span', 'badge', String(album.year)));
    if (album.instrumental) {
      var ib = el('span', 'badge badge-inst', T('album.instrumental'));
      ib.setAttribute('data-i18n', 'album.instrumental');
      badges.appendChild(ib);
    }
    badges.appendChild(el('span', 'badge', album.tracks.length + ' ' + I18N.plural('tracks', album.tracks.length)));
    info.appendChild(badges);
    head.appendChild(info);
    head.appendChild(el('span', 'chev'));
    card.appendChild(head);

    var body = el('div', 'album-body');
    body.hidden = true;

    var ul = el('ol', 'tracks');
    album.tracks.forEach(function (t, idx) {
      var li = el('li', 'track');
      li.dataset.n = String(idx + 1);
      var nameEl = el('span', 'track-name', t.title);
      var eq = el('span', 'eq');
      eq.setAttribute('aria-hidden', 'true');
      eq.appendChild(document.createElement('i'));
      eq.appendChild(document.createElement('i'));
      eq.appendChild(document.createElement('i'));
      nameEl.appendChild(eq);
      li.appendChild(nameEl);
      var links = el('span', 'track-links');
      var holder = el('div', 'drive-player');
      holder.hidden = true;
      if (t.drive || t.audio) {
        var pb = el('button', 'pill pill-play', T('track.play'));
        pb.type = 'button';
        pb.setAttribute('aria-label', T('track.playAria', { t: t.title }));
        holder.btn = pb;
        trackRows[trackKey(album.id, t.title)] = { li: li, holder: holder, t: t, album: album };
        li._play = function () { toggleDrivePlayer(holder, t, album); };
        pb.addEventListener('click', li._play);
        links.appendChild(pb);
        var d = el('a', 'pill pill-dl', T('track.download'));
        d.href = t.drive ? driveLink(t.drive) : t.audio; d.rel = 'noopener';
        // Скачування з правильним іменем «Alex Sanr - Назва.mp3» (потрібен DRIVE_KEY)
        d.addEventListener('click', function (e) {
          if (!DRIVE_KEY || !t.drive) return;
          e.preventDefault();
          var label = d.textContent;
          d.textContent = '…'; d.style.pointerEvents = 'none';
          fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(t.drive) + '?alt=media&key=' + DRIVE_KEY)
            .then(function (r) { if (!r.ok) throw new Error('http'); return r.blob(); })
            .then(function (b) {
              var u = URL.createObjectURL(new Blob([b], { type: 'audio/mpeg' }));
              var x = document.createElement('a');
              x.href = u;
              x.download = ('Alex Sanr - ' + t.title).replace(/[\\\/:*?"<>|]/g, '').trim() + '.mp3';
              document.body.appendChild(x); x.click(); x.remove();
              setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
            })
            .catch(function () { location.href = driveLink(t.drive); })
            .then(function () { d.textContent = label; d.style.pointerEvents = ''; });
        });
        d.setAttribute('aria-label', T('track.downloadAria', { t: t.title }));
        links.appendChild(d);
      }
      if (t.clip) {
        var c = el('a', 'pill pill-clip', T('track.clip'));
        c.href = t.clip; c.target = '_blank'; c.rel = 'noopener';
        c.setAttribute('aria-label', T('track.clipAria', { t: t.title }));
        links.appendChild(c);
      } else {
        var g = el('span', 'pill pill-ghost', T('track.clip'));
        g.setAttribute('aria-hidden', 'true');
        links.appendChild(g);
      }
      var sh = el('button', 'pill pill-share', T('song.share'));
      sh.type = 'button';
      sh.setAttribute('aria-label', T('track.shareAria', { t: t.title }));
      sh.addEventListener('click', function () { shareTrack(sh, t, album, idx + 1); });
      links.appendChild(sh);
      li.appendChild(links);
      li.appendChild(holder);
      ul.appendChild(li);
    });
    body.appendChild(ul);
    card.appendChild(body);

    head.addEventListener('click', function () {
      if (card.classList.contains('open')) closeAlbum(card); else openAlbum(card, album);
    });
    return card;
  }

  function render() {
    albumsEl.textContent = '';
    var shown = albums.filter(function (a) { return currentLang === 'all' || a.lang === currentLang; });
    if (!shown.length) {
      albumsEl.appendChild(el('p', 'note', T('albums.empty')));
      return;
    }
    shown.forEach(function (a, i) {
      var card = buildCard(a);
      card.style.setProperty('--i', i);
      albumsEl.appendChild(card);
    });
  }

  function buildStats() {
    var statsEl = document.getElementById('stats');
    if (!statsEl) return;
    var total = albums.reduce(function (n, a) { return n + a.tracks.length; }, 0);
    var langs = [];
    albums.forEach(function (a) { if (langs.indexOf(a.lang) < 0) langs.push(a.lang); });
    [[albums.length, I18N.plural('albums', albums.length)], [total, I18N.plural('tracks', total)], [langs.length, I18N.plural('languages', langs.length)]].forEach(function (s) {
      var chip = el('span', 'stat');
      chip.appendChild(el('b', null, String(s[0])));
      chip.appendChild(document.createTextNode(' ' + s[1]));
      statsEl.appendChild(chip);
    });
  }

  function buildFilters() {
    var present = [];
    albums.forEach(function (a) { if (present.indexOf(a.lang) < 0) present.push(a.lang); });
    filtersEl.textContent = '';
    if (present.length < 2) return;
    filtersEl.appendChild(el('span', 'filters-label', T('filters.label')));
    var items = [['all', 'ALL']].concat(present.map(function (l) { return [l, (FLAGS[l] ? FLAGS[l] + ' ' : '') + (LANG_CODES[l] || l.toUpperCase())]; }));
    items.forEach(function (it) {
      var b = el('button', 'chip', it[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(it[0] === currentLang));
      b.addEventListener('click', function () {
        currentLang = it[0];
        Array.prototype.forEach.call(filtersEl.querySelectorAll('.chip'), function (x, i) {
          x.setAttribute('aria-pressed', String(items[i][0] === currentLang));
        });
        render();
      });
      filtersEl.appendChild(b);
    });
  }

  function openFromQuery() {
    var p = new URLSearchParams(location.search);
    var id = (p.get('album') || '').replace(/[^\w-]/g, '');
    if (!id) return;
    var card = albumsEl.querySelector('.album[data-id="' + id + '"]');
    if (!card) return;
    card.querySelector('.album-head').click();
    var n = parseInt(p.get('track'), 10);
    var row = n ? card.querySelector('.track[data-n="' + n + '"]') : null;
    if (row && row._play) row._play();
    setTimeout(function () {
      (row || card).scrollIntoView({ behavior: 'smooth', block: row ? 'center' : 'start' });
    }, 80);
  }

  document.addEventListener('play', function (e) {
    Array.prototype.forEach.call(document.querySelectorAll('audio'), function (a) {
      if (a !== e.target) a.pause();
    });
  }, true);

  var q = new URLSearchParams(location.search).get('lang');
  if (q) currentLang = q;
  if (new URLSearchParams(location.search).get('album')) currentLang = 'all';

  fetch('albums.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      albums = data.albums || [];
      if (currentLang !== 'all' && !albums.some(function (a) { return a.lang === currentLang; })) currentLang = 'all';
      buildStats();
      buildFilters();
      render();
      openFromQuery();
    })
    .catch(function () {
      albumsEl.textContent = '';
      albumsEl.appendChild(el('p', 'note', T('albums.error')));
    });
})();
</script>
</body>
</html>
